# Render blueprint. `check` only — see docs/decisions/013.
#
# No database, because nothing is stored. That is not a deferred feature: the
# page says nothing is kept, and adding a store would make that untrue.
services:
  - type: web
    name: voice-check
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # `checksPass`: deploy only when the branch's CI checks pass.
    #
    # Verified against Render's blueprint spec on 2026-08-26: `autoDeployTrigger`
    # takes `commit` | `checksPass` | `off`, defaults to `commit` for a new
    # service, and replaces the deprecated `autoDeploy`.
    #
    # EXPECT A DEPLOY TO TRAIL ITS PUSH BY ABOUT TWENTY MINUTES, AND DO NOT
    # TREAT THAT AS A FAULT. Measured 2026-08-26: GitHub creates the workflow
    # run 19.5–21.0 minutes after the push (n=5, mean 20.2), and each run then
    # passes in about 40 seconds. The deploy waits for the check, so it waits
    # for the queue. Full figures in ADR 013.
    #
    # This was `"off"` for part of an afternoon, on the belief that no check
    # would ever arrive. That belief came from nine observations of zero runs,
    # every one taken inside the twenty-minute window — see ADR 015. Checks do
    # arrive, the latency costs this project nothing, and the gate is worth
    # having: untested code cannot reach the service.
    #
    # Not `commit`, which is what this service did on its first day: deploy
    # every push whether or not the tests passed. A deploy that can outrun its
    # own tests is not a gate.
    #
    # QUOTED DELIBERATELY, and the quoting is about the syntax rather than this
    # particular value. YAML 1.1 reads bare `off`, `on`, `yes` and `no` as
    # booleans while YAML 1.2 reads them as strings — the trap that makes
    # GitHub Actions' `on:` key parse as `true`. `checksPass` is safe unquoted;
    # it is quoted anyway so that changing the value to `off` later cannot
    # silently change its type.
    autoDeployTrigger: "checksPass"
    # `lexicons/` is read at runtime relative to the compiled module, so it has
    # to survive the build. It does: tsc emits to dist/ and leaves the rest of
    # the tree alone.
    # --include=dev because the build needs TypeScript, and Render sets
    # NODE_ENV=production, under which npm ci skips devDependencies. Without
    # the flag the build fails with "tsc: not found" — which typechecks
    # locally and dies on the first deploy.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/web/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # Deliberately absent: ANTHROPIC_API_KEY. The deployed surface is `check`,
      # which calls no model. If a key ever appears here, something has been
      # deployed that should not have been.
