# Render blueprint. `check` only — see docs/decisions/013.
#
# No database, because nothing is stored. That is not a deferred feature: the
# page says nothing is kept, and adding a store would make that untrue.
services:
  - type: web
    name: voice-check
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # `off`. Read the next paragraph before changing it.
    #
    # Verified against Render's blueprint spec on 2026-08-26: `autoDeployTrigger`
    # takes `commit` | `checksPass` | `off`, defaults to `commit` for a new
    # service, and replaces the deprecated `autoDeploy`.
    #
    # This was `checksPass` for about an hour, which was worse than useless.
    # GitHub creates no workflow runs for pushes to this repository — see
    # ADR 013 — so there are no checks on the branch, and a gate waiting for a
    # signal that never arrives does not hold anything back, it stops the
    # traffic entirely while looking like it is working.
    #
    # Not `commit` either. `commit` is what this service did on its first day:
    # deploy every push whether or not the tests passed. A deploy that can
    # outrun its own tests is not a gate.
    #
    # `off` makes both halves manual and both halves real: dispatch `build`,
    # watch it go green, deploy from the Render dashboard. A manual gate is
    # still a gate. An automatic one waiting on a signal that never comes is
    # not, and is harder to notice.
    #
    # Restore `checksPass` the day a push creates a check run again.
    #
    # QUOTED DELIBERATELY. `off` is a boolean in YAML 1.1 and a string in
    # YAML 1.2, so an unquoted `off` reaches a 1.1 parser as `false` — the same
    # trap that makes GitHub Actions' `on:` key parse as `true`. Render's spec
    # lists the value as `off` and shows no example of how to write it, so
    # which parser is on the other end is unknown. `"off"` is the string under
    # both.
    autoDeployTrigger: "off"
    # `lexicons/` is read at runtime relative to the compiled module, so it has
    # to survive the build. It does: tsc emits to dist/ and leaves the rest of
    # the tree alone.
    # --include=dev because the build needs TypeScript, and Render sets
    # NODE_ENV=production, under which npm ci skips devDependencies. Without
    # the flag the build fails with "tsc: not found" — which typechecks
    # locally and dies on the first deploy.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/web/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      # Deliberately absent: ANTHROPIC_API_KEY. The deployed surface is `check`,
      # which calls no model. If a key ever appears here, something has been
      # deployed that should not have been.
