name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second push while the first is still building would
# otherwise race, and the loser wins.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never deploys a build that did not pass. The `ci` workflow runs on the
    # same push; this waits for its conclusion rather than duplicating it.
    steps:
      - uses: actions/checkout@v4

      - name: wait for ci
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: check
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: trigger render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set — nothing to deploy to."
            echo "Create the service from render.yaml, then add its deploy hook"
            echo "as a repository secret. Failing loudly rather than passing green."
            exit 1
          fi
          curl -sf -X POST "$HOOK" > /dev/null
          echo "deploy triggered for ${GITHUB_SHA:0:7}"
