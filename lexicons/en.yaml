# English lexicon for voice-check. See lexicons/sr.yaml for the conventions;
# the `*` inflection suffix is available here too but is rarely needed, because
# English inflection mostly is not a suffix problem.
version: "0.1.0"
language: en

phrases:
  weasel-words:
    - experts say
    - many believe
    - reports suggest
    - critics argue
    - it is widely

  editorializing:
    - it's important to note
    - it's worth mentioning
    - in this article we

  promotional-tone:
    - incredible
    - stunning
    - breathtaking
    - must-try

  inflated-vocabulary:
    - delve
    - landscape
    - synergy
    - empower
    - leverage
    - robust
    - seamless
    - tapestry

  summary-close:
    - in conclusion
    - all in all
    - to summarize

  transition-density:
    - moreover
    - furthermore
    - additionally
    - however
    - on the other hand

patterns:
  negative-parallelism:
    - (?<![\p{L}])not\s+just(?![\p{L}])[^.!?\n]{0,80}?(?<![\p{L}])but(?![\p{L}])
    - (?<![\p{L}])it[’']?s\s+not(?![\p{L}])[^.!?\n]{0,60}?,\s*it[’']?s(?![\p{L}])

  rule-of-three:
    - (?<![\p{L}])\p{L}{3,}(?:[ \t]+\p{L}+){0,2},\s+\p{L}{3,}(?:[ \t]+\p{L}+){0,2},?\s+and\s+\p{L}{3,}(?![\p{L}])
