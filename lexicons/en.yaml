# English lexicon for voice-check. See lexicons/sr.yaml for the conventions and
# for why every entry carries its own `matches:` example.
#
# The `*` inflection suffix is available here too but is rarely needed, because
# English inflection mostly is not a suffix problem.
version: "0.3.0"
language: en

phrases:
  weasel-words:
    - phrase: experts say
      matches: "Experts say otherwise."
    - phrase: many believe
      matches: "Many believe the opposite."
    - phrase: reports suggest
      matches: "Reports suggest a rise."
    - phrase: critics argue
      matches: "Critics argue the point."
    - phrase: it is widely
      matches: "It is widely known."

  editorializing:
    - phrase: it's important to note
      matches: "It's important to note this."
    - phrase: it's worth mentioning
      matches: "It’s worth mentioning that."
    - phrase: in this article we
      matches: "In this article we explore the idea."

  promotional-tone:
    - phrase: incredible
      matches: "An incredible result."
    - phrase: stunning
      matches: "A stunning result."
    - phrase: breathtaking
      matches: "A breathtaking result."
    - phrase: must-try
      matches: "A must-try feature."

  inflated-vocabulary:
    - phrase: delve
      matches: "We delve into the material."
    # `landscape` is a tell in "the evolving landscape of AI" and an ordinary
    # noun everywhere else. The exceptions cover the two usages that actually
    # turn up in technical writing.
    - phrase: landscape
      matches: "The evolving landscape of AI."
      doesNotMatch: "We switched the chart to landscape orientation."
      except:
        - landscape orientation
        - landscape mode
        - landscape photography
    - phrase: synergy
      matches: "The synergy between them."
    - phrase: empower
      matches: "It will empower the team."
    - phrase: leverage
      matches: "We leverage the data."
    - phrase: robust
      matches: "A robust system."
    - phrase: seamless
      matches: "A seamless transformation."
    - phrase: tapestry
      matches: "A rich tapestry of ideas."

  summary-close:
    - phrase: in conclusion
      matches: "In conclusion, we are done."
    - phrase: all in all
      matches: "All in all, it worked."
    - phrase: to summarize
      matches: "To summarize, it worked."

  transition-density:
    - phrase: moreover
      matches: "Moreover, it works."
    - phrase: furthermore
      matches: "Furthermore, it is fast."
    - phrase: additionally
      matches: "Additionally, it is cheap."
    - phrase: however
      matches: "However, it costs more."
    - phrase: on the other hand
      matches: "On the other hand, it costs."

patterns:
  negative-parallelism:
    - pattern: (?<![\p{L}])not\s+just(?![\p{L}])[^.!?\n]{0,80}?(?<![\p{L}])but(?![\p{L}])
      matches: "This is not just a tool but a philosophy."
      doesNotMatch: "This is not a tool."
    - pattern: (?<![\p{L}])it[’']?s\s+not(?![\p{L}])[^.!?\n]{0,60}?,\s*it[’']?s(?![\p{L}])
      matches: "It's not a product, it's a practice."

  rule-of-three:
    - pattern: (?<![\p{L}])\p{L}{3,}(?:[ \t]+\p{L}+){0,2},\s+\p{L}{3,}(?:[ \t]+\p{L}+){0,2},?\s+and\s+\p{L}{3,}(?![\p{L}])
      matches: "Knowledge, tools, and people."
      # An ordinary enumeration in technical prose, not a tricolon tic. There
      # is no structural difference between the two — see the README: this
      # suppresses one literal list and does not generalise.
      doesNotMatch: "I care about architecture, code quality, and shipping."
      except:
        - architecture, code quality, and shipping
# Exceptions for STRUCTURAL rules. See lexicons/sr.yaml for the reasoning.
#
# `participial-close` fires on any `-ing` word directly after a comma, and most
# of those really are participial closes. The exceptions here are words that
# are NEVER a participle in that position.
#
# Deliberately NOT exempted: `meaning`, `warning`, `feeling`, `building`. Each
# looks like a false positive and is not — `, meaning the job fails silently`
# is exactly the construction the rule exists for, and the pattern requires the
# word directly after the comma, so `, a building` never matches in the first
# place. An exception list that grows by adding whatever last annoyed somebody
# ends up suppressing the rule.
exceptions:
  participial-close:
    - phrase: nothing
      suppresses: "The alert fired, nothing else happened."
    - phrase: something
      suppresses: "We waited, something had to give."
    - phrase: anything
      suppresses: "He never said, anything at all."
    - phrase: everything
      suppresses: "The import ran, everything looked fine."
    - phrase: during
      suppresses: "It failed twice, during the nightly import."
    - phrase: morning
      suppresses: "We checked it twice, morning and night."
    - phrase: evening
      suppresses: "The job ran late, evening after evening."
